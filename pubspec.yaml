name: pharmacy_alamal
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  provider: ^6.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/alamal.png

  fonts:
    - family: Cairo
      fonts:
        - asset: lib/fonts/Cairo-Regular.ttf
        - asset: lib/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: lib/fonts/Cairo-Bold.ttf
          weight: 700
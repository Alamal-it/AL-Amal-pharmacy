name: pharmacy_alamal
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  provider: ^6.1.2

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.12.3
  geocoding: ^4.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_sign_in: ^7.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/

  fonts:
    - family: Cairo
      fonts:
        - asset: lib/fonts/Cairo-Regular.ttf
        - asset: lib/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: lib/fonts/Cairo-Bold.ttf
          weight: 700